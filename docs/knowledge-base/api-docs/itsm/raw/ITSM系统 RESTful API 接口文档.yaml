openapi: 3.0.3
info:
  title: 山信软件 ITSM API
  description: |
    山信软件 ITSM (IT Service Management) 系统 RESTful API 接口文档。
    
    **认证方式说明：**
    - 内部用户：使用 JWT Bearer Token 认证（`Authorization: Bearer {token}`）
    - 外部系统：使用 API Key 认证（`X-API-Key: itsm_{env}_{key}`）
    
    **设计规范：**
    - 所有 ID 字段使用字符串类型传输（雪花算法 ID 避免 JS 精度丢失）
    - 业务错误统一返回 HTTP 200，通过 `code` 字段区分（如 210001 表示用户名密码错误）
    - 时间格式：ISO 8601（`2026-04-01T10:00:00+08:00`）
    - ID 传输：字符串形式（如 `"1234567890123456789"`）
  version: 1.0.0
  contact:
    name: 架构师 / 后端负责人
    email: architect@shanxin.com

servers:
  - url: http://itsm-dev.shanxin.internal/api/v1
    description: 内部网络（开发/测试环境）
  - url: https://itsm.shanxin.com/api/v1
    description: 生产环境（经 Traefik 路由）

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: 认证
    description: 登录、登出、Token 刷新、密码管理
  - name: 用户与权限
    description: 用户管理、用户组、角色与权限配置
  - name: 服务配置
    description: 服务目录、服务模型、工作流定义
  - name: 工单核心
    description: 工单生命周期管理（创建、接单、转单、挂起、关闭等）
  - name: SLA 管理
    description: SLA 策略、节假日、统计报表
  - name: 知识库
    description: 知识条目、分类、审核流程
  - name: 运维日历与排班
    description: 日历事件、值班排班、当日值班查询
  - name: 消息推送渠道
    description: 通知渠道配置、测试、开关控制
  - name: 审计日志
    description: 操作审计、登录日志查询
  - name: 附件管理
    description: 文件上传、下载、删除

paths:
  # ============== 认证接口 ==============
  /auth/login:
    post:
      tags:
        - 认证
      summary: 用户登录
      description: 用户名密码登录，连续失败 5 次锁定账号
      operationId: login
      security: []  # 免鉴权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功或业务错误（用户名密码错误等）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponseData'

  /auth/refresh:
    post:
      tags:
        - 认证
      summary: 刷新 Token
      description: 使用 Refresh Token 换取新的 Token 对（旋转机制，旧 Refresh Token 立即失效）
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh Token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                            description: Access Token 有效期（秒）

  /auth/logout:
    post:
      tags:
        - 认证
      summary: 登出
      description: 服务端将当前 Access Token 加入 Redis 黑名单
      operationId: logout
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/forgot-password:
    post:
      tags:
        - 认证
      summary: 忘记密码（发送验证码）
      description: 向用户邮箱或手机发送验证码
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNo
                - channel
              properties:
                accountNo:
                  type: string
                  description: 账号
                channel:
                  type: string
                  enum: [EMAIL, SMS]
                  description: 发送渠道
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resetToken:
                            type: string
                            description: 用于后续重置请求的临时 Token
                          expiresIn:
                            type: integer
                            description: 有效期（秒）

  /auth/reset-password:
    post:
      tags:
        - 认证
      summary: 重置密码
      description: 使用验证码重置密码
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - verifyCode
                - newPassword
                - confirmPassword
              properties:
                resetToken:
                  type: string
                verifyCode:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/change-password:
    post:
      tags:
        - 认证
      summary: 修改密码
      description: 已登录用户修改密码
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
                - confirmPassword
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
                confirmPassword:
                  type: string
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============== 用户与权限 ==============
  /users:
    get:
      tags:
        - 用户与权限
      summary: 获取用户列表
      description: 支持分页、搜索、部门筛选、状态筛选
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/KeywordParam'
        - name: deptId
          in: query
          schema:
            type: string
          description: 部门 ID 筛选
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1, 2]
          description: 状态筛选（0禁用 1启用 2待审核）
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResponse'
    post:
      tags:
        - 用户与权限
      summary: 创建用户（管理员直接创建）
      description: 初始密码由系统生成后通过邮件发送
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserBasicInfo'

  /users/{id}:
    get:
      tags:
        - 用户与权限
      summary: 获取用户详情
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'
    patch:
      tags:
        - 用户与权限
      summary: 更新用户信息
      description: 所有字段可选，仅传需更新的字段。本人仅可修改邮箱、手机号、头像
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}/approve:
    post:
      tags:
        - 用户与权限
      summary: 审核通过用户注册申请
      operationId: approveUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 审核通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}/reject:
    post:
      tags:
        - 用户与权限
      summary: 驳回用户注册申请
      operationId: rejectUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: 驳回原因
      responses:
        '200':
          description: 已驳回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/{id}/roles:
    put:
      tags:
        - 用户与权限
      summary: 分配用户角色
      operationId: assignUserRoles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roleIds
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                  description: 角色 ID 列表
      responses:
        '200':
          description: 分配成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user-groups:
    get:
      tags:
        - 用户与权限
      summary: 获取用户组列表
      operationId: listUserGroups
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 用户组列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResponse'
    post:
      tags:
        - 用户与权限
      summary: 创建用户组
      operationId: createUserGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - deptId
              properties:
                name:
                  type: string
                  description: 组名称
                deptId:
                  type: string
                  description: 部门 ID
                description:
                  type: string
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /user-groups/{id}/members:
    put:
      tags:
        - 用户与权限
      summary: 更新用户组成员
      operationId: updateGroupMembers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - members
              properties:
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: string
                      roleInGroup:
                        type: string
                        enum: [LEADER, MEMBER]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /roles:
    get:
      tags:
        - 用户与权限
      summary: 获取角色列表
      operationId: listRoles
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'

  /permissions/tree:
    get:
      tags:
        - 用户与权限
      summary: 获取权限树
      operationId: getPermissionTree
      responses:
        '200':
          description: 权限树结构
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PermissionNode'

  /roles/{id}/permissions:
    put:
      tags:
        - 用户与权限
      summary: 更新角色权限
      operationId: updateRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissionIds
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============== 服务配置 ==============
  /service-catalogs/tree:
    get:
      tags:
        - 服务配置
      summary: 获取服务目录树
      operationId: getServiceCatalogTree
      responses:
        '200':
          description: 服务目录树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceCatalogNode'

  /service-models:
    get:
      tags:
        - 服务配置
      summary: 获取服务模型列表
      operationId: listServiceModels
      parameters:
        - name: catalogId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: integer
        - name: keyword
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 服务模型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResponse'
    post:
      tags:
        - 服务配置
      summary: 创建服务模型
      operationId: createServiceModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceModelRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /service-models/{id}/form-fields:
    get:
      tags:
        - 服务配置
      summary: 获取服务模型表单字段
      operationId: getServiceModelFormFields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 表单字段列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormField'
    put:
      tags:
        - 服务配置
      summary: 更新表单字段（批量）
      operationId: updateServiceModelFormFields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fields
              properties:
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/FormField'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /workflow-defs:
    get:
      tags:
        - 服务配置
      summary: 获取工作流列表
      operationId: listWorkflowDefs
      responses:
        '200':
          description: 工作流列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkflowDef'

  /workflow-defs/{id}:
    get:
      tags:
        - 服务配置
      summary: 获取工作流详情（含状态机配置）
      operationId: getWorkflowDefById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 工作流详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkflowDefDetail'

  # ============== 工单核心 ==============
  /tickets:
    get:
      tags:
        - 工单核心
      summary: 查询工单列表
      description: 数据范围由角色决定
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - $ref: '#/components/parameters/KeywordParam'
        - name: status
          in: query
          schema:
            type: string
          description: 状态筛选，多个用逗号分隔
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: modelId
          in: query
          schema:
            type: string
        - name: assignedGroupId
          in: query
          schema:
            type: string
        - name: assignedUserId
          in: query
          schema:
            type: string
        - name: createdUserId
          in: query
          schema:
            type: string
        - name: slaStatus
          in: query
          schema:
            type: string
            enum: [NORMAL, WARNING, BREACH]
          description: SLA 状态筛选
        - name: createdAtStart
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAtEnd
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/OrderByParam'
        - $ref: '#/components/parameters/OrderDirParam'
      responses:
        '200':
          description: 工单列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResponse'
                          - type: object
                            properties:
                              list:
                                type: array
                                items:
                                  $ref: '#/components/schemas/TicketListItem'
    post:
      tags:
        - 工单核心
      summary: 创建工单
      description: 支持内部用户和外部系统（API Key）创建
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketBasicInfo'

  /tickets/{id}:
    get:
      tags:
        - 工单核心
      summary: 获取工单详情
      operationId: getTicketById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 工单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TicketDetail'

  /tickets/{id}/claim:
    post:
      tags:
        - 工单核心
      summary: 接单
      description: 当前用户自动成为处理人，需目标用户组成员权限
      operationId: claimTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 接单成功或业务错误（已被他人接单等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tickets/{id}/transfer:
    post:
      tags:
        - 工单核心
      summary: 转单
      description: 当前处理人或管理员权限
      operationId: transferTicket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetGroupId
              properties:
                targetGroupId:
                  type: string
                  description: 目标用户组 ID
                targetUserId:
                  type: string
                  description: 目标处理人 ID（可选）
                reason:
                  type: string
                  description: 转单原因
      responses:
        '200':
          description: 转单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /tickets/{id}/suspend:
    post:
      tags:
        - 工单核心
      summary: 挂起
      description: 仅当前处理人可操作
      operationId: suspendTicket
      parameters:
        - name: id
          in: path
          required: true
