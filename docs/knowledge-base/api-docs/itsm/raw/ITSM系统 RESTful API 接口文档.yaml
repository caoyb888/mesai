                                type: array
                                items:
                                  $ref: '#/components/schemas/AuditLog'

  /audit-logs/login:
    get:
      tags:
        - 审计日志
      summary: 查询登录日志
      operationId: listLoginLogs
      parameters:
        - name: accountNo
          in: query
          schema:
            type: string
        - name: loginIp
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [SUCCESS, FAIL]
        - name: startTime
          in: query
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 登录日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PageResponse'

  # ============== 附件管理 ==============
  /attachments:
    post:
      tags:
        - 附件管理
      summary: 上传附件
      description: 支持 multipart/form-data 上传，最大 20MB
      operationId: uploadAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传文件（最大 20MB）
                refType:
                  type: string
                  enum: [TICKET, KB_ARTICLE, COMMENT]
                  description: 关联类型
                refId:
                  type: string
                  description: 关联业务 ID（可选，上传后再关联）
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Attachment'

  /attachments/{id}/download:
    get:
      tags:
        - 附件管理
      summary: 下载附件
      description: 直接返回文件流，校验与关联业务的数据权限
      operationId: downloadAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 文件流
          content:
            '*/*':
              schema:
                type: string
                format: binary

  /attachments/{id}:
    delete:
      tags:
        - 附件管理
      summary: 删除附件
      description: 逻辑删除，实体文件由定时任务清理。仅上传人本人或管理员可操作
      operationId: deleteAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============== 健康检查 ==============
  /health:
    get:
      tags:
        - 系统
      summary: 健康检查
      description: 运维用，免鉴权
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token（内部用户）
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key 认证（外部系统），格式 `itsm_{env}_{32位随机字符串}`

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: 页码，从 1 开始
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
      description: 每页条数，最大 100
    KeywordParam:
      name: keyword
      in: query
      schema:
        type: string
      description: 搜索关键词
    OrderByParam:
      name: orderBy
      in: query
      schema:
        type: string
        default: createdAt
      description: 排序字段
    OrderDirParam:
      name: orderDir
      in: query
      schema:
        type: string
        default: desc
        enum: [asc, desc]
      description: 排序方向

  schemas:
    # 基础结构
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: integer
          description: 业务状态码，6 位数字
          example: 200000
        message:
          type: string
          description: 提示信息（中文）
          example: 成功
        data:
          type: object
          description: 业务数据，失败时为 null
        traceId:
          type: string
          description: 链路追踪 ID
          example: abc123def456

    PageRequest:
      type: object
      properties:
        page:
          type: integer
          default: 1
        pageSize:
          type: integer
          default: 20
          maximum: 100
        orderBy:
          type: string
          default: createdAt
        orderDir:
          type: string
          enum: [asc, desc]
          default: desc

    PageResponse:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
        total:
          type: integer
          description: 总记录数
        page:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        totalPages:
          type: integer
          description: 总页数

    # 认证相关
    LoginRequest:
      type: object
      required:
        - accountNo
        - password
      properties:
        accountNo:
          type: string
          example: admin001
        password:
          type: string
          format: password
        captchaToken:
          type: string
          description: 可选验证码 Token

    LoginResponseData:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access Token 有效期（秒），默认 7200
        userInfo:
          $ref: '#/components/schemas/UserBasicInfo'

    UserBasicInfo:
      type: object
      properties:
        id:
          type: string
          description: 用户 ID（字符串形式）
        accountNo:
          type: string
        employeeName:
          type: string
        email:
          type: string
        phone:
          type: string
        roles:
          type: array
          items:
            type: string
        deptId:
          type: string
        deptName:
          type: string

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserBasicInfo'
        - type: object
          properties:
            status:
              type: integer
              enum: [0, 1, 2]
              description: 0禁用 1启用 2待审核
            lastLoginAt:
              type: string
              format: date-time
            createdAt:
              type: string
              format: date-time

    CreateUserRequest:
      type: object
      required:
        - accountNo
        - employeeName
        - email
        - phone
        - deptId
      properties:
        accountNo:
          type: string
        employeeName:
          type: string
        email:
          type: string
        phone:
          type: string
        deptId:
          type: string
        roleIds:
          type: array
          items:
            type: string
        groupIds:
          type: array
          items:
            type: string

    UpdateUserRequest:
      type: object
      properties:
        employeeName:
          type: string
        email:
          type: string
        phone:
          type: string
        deptId:
          type: string
        status:
          type: integer
          enum: [0, 1, 2]

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string

    PermissionNode:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [MENU, BUTTON]
        children:
          type: array
          items:
            $ref: '#/components/schemas/PermissionNode'

    # 服务配置
    ServiceCatalogNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogNode'

    ServiceModelRequest:
      type: object
      required:
        - catalogId
        - name
        - code
      properties:
        catalogId:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
        workflowDefId:
          type: string
        slaPolicyId:
          type: string
        defaultGroupId:
          type: string

    FormField:
      type: object
      properties:
        id:
          type: string
        fieldKey:
          type: string
        fieldType:
          type: string
          enum: [TEXT, TEXTAREA, SELECT, CI_REF, DATE, DATETIME, NUMBER]
        label:
          type: string
        required:
          type: boolean
        placeholder:
          type: string
        sortOrder:
          type: integer

    WorkflowDef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        version:
          type: integer

    WorkflowDefDetail:
      allOf:
        - $ref: '#/components/schemas/WorkflowDef'
        - type: object
          properties:
            states:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  label:
                    type: string
                  isInitial:
                    type: boolean
            transitions:
              type: array
              items:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
                  action:
                    type: string
                  actor:
                    type: string
                  description:
                    type: string
            allowCloseStates:
              type: array
              items:
                type: string

    # 工单相关
    CreateTicketRequest:
      type: object
      required:
        - modelId
        - title
        - priority
      properties:
        modelId:
          type: string
          description: 服务模型 ID
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        formData:
          type: object
          description: 动态表单数据，键值对形式
        ciIds:
          type: array
          items:
            type: string
          description: 关联配置项 ID 列表
        source:
          type: string
          description: API Key 创建时可选，默认为 API

    TicketBasicInfo:
      type: object
      properties:
        id:
          type: string
        ticketNo:
          type: string
          example: TK-2026-000123
        status:
          type: string
        title:
          type: string
        priority:
          type: string
        assignedGroupId:
          type: string
        assignedGroupName:
          type: string
        slaDeadlineResponse:
          type: string
          format: date-time
        slaDeadlineResolve:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TicketListItem:
      type: object
      properties:
        id:
          type: string
        ticketNo:
          type: string
        title:
          type: string
        status:
          type: string
        priority:
          type: string
        modelName:
          type: string
        createdUserName:
          type: string
        assignedGroupName:
          type: string
        assignedUserName:
          type: string
        slaDeadlineResolve:
          type: string
          format: date-time
        slaResolveStatus:
          type: string
          enum: [NORMAL, WARNING, BREACH]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketBasicInfo'
        - type: object
          properties:
            modelId:
              type: string
            modelName:
              type: string
            description:
              type: string
            source:
              type: string
            formData:
              type: object
            createdUser:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                deptName:
                  type: string
            assignedGroup:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            assignedUser:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            sla:
              type: object
              properties:
                policyName:
                  type: string
                deadlineResponse:
                  type: string
                  format: date-time
                deadlineResolve:
                  type: string
                  format: date-time
                actualResponseAt:
                  type: string
                  format: date-time
                responseStatus:
                  type: string
                resolveStatus:
                  type: string
            ciList:
              type: array
              items:
                type: object
                properties:
                  ciId:
                    type: string
                  ciType:
                    type: string
                  ciName:
                    type: string
                  relationType:
                    type: string

    TicketFlowLog:
      type: object
      properties:
        id:
          type: string
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        action:
          type: string
        actorType:
          type: string
          enum: [USER, SYSTEM]
        operatorId:
          type: string
        operatorName:
          type: string
        remark:
          type: string
        operatedAt:
          type: string
          format: date-time

    TicketComment:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        isInternal:
          type: boolean
        creatorName:
          type: string
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    # SLA 相关
    SlaPolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serviceTimeType:
          type: string
          enum: [5x8, 7x24]
        responseMedium:
          type: integer
          description: 响应时间（分钟）
        responseHigh:
          type: integer
        responseCritical:
          type: integer
        resolveLow:
          type: integer
        resolveMedium:
          type: integer
        resolveHigh:
          type: integer
        resolveCritical:
          type: integer

    SlaPolicyRequest:
      type: object
      required:
        - name
        - serviceTimeType
      properties:
        name:
          type: string
        serviceTimeType:
          type: string
        serviceTimeJson:
          type: object
          nullable: true
        responseMedium:
          type: integer
        responseHigh:
          type: integer
        responseCritical:
          type: integer
        resolveLow:
          type: integer
        resolveMedium:
          type: integer
        resolveHigh:
          type: integer
        resolveCritical:
          type: integer
        createdWarnMinutes:
          type: integer
        createdEscalateMinutes:
          type: integer
        warnThresholdPct:
          type: integer

    Holiday:
      type: object
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        isWorkday:
          type: boolean
          description: 是否调休工作日

    SlaStatistics:
      type: object
      properties:
        totalTickets:
          type: integer
        responseAchieveRate:
          type: number
          format: float
          description: 响应达成率（0-1）
        resolveAchieveRate:
          type: number
          format: float
        avgResponseMinutes:
          type: integer
        avgResolveMinutes:
          type: integer
        breachCount:
          type: integer
        byPriority:
          type: object
          additionalProperties:
            type: object
            properties:
              total:
                type: integer
              breachCount:
                type: integer

    # 知识库
    KbArticleRequest:
      type: object
      required:
        - categoryId
        - title
        - content
      properties:
        categoryId:
          type: string
        title:
          type: string
        summary:
          type: string
        keywords:
          type: string
        content:
          type: string
          description: HTML 富文本内容
        probeRefId:
          type: string
        attachmentIds:
          type: array
          items:
            type: string

    KbArticleVersion:
      type: object
      properties:
        version:
          type: integer
        content:
          type: string
        updatedBy:
          type: string
        updatedAt:
          type: string
          format: date-time

    KbCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string
        sortOrder:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/KbCategory'

    # 日历排班
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        eventType:
          type: string
          enum: [CHANGE_WINDOW, MAINTENANCE, MEETING]
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
        relatedGroupId:
          type: string
        color:
          type: string
          description: 日历显示颜色（如 #FF6B35）

    CalendarEventRequest:
      type: object
      required:
        - title
        - eventType
        - startTime
        - endTime
      properties:
        title:
          type: string
        eventType:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allDay:
          type: boolean
          default: false
        relatedGroupId:
          type: string
        color:
          type: string

    OnDutyInfo:
      type: object
      properties:
        date:
          type: string
          format: date
        groupId:
          type: string
        onDutyUser:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type: string
            email:
              type: string

    # 消息渠道
    NotifyChannel:
      type: object
      properties:
        id:
          type: string
        channelType:
          type: string
          enum: [EMAIL, SMS, LARK, WECHAT, DINGTALK]
        name:
          type: string
        isEnabled:
          type: integer
          enum: [0, 1]
        lastTestAt:
          type: string
          format: date-time
        lastTestResult:
          type: string
          enum: [SUCCESS, FAIL]
        lastTestError:
          type: string
        rateLimitCount:
          type: integer
        dailyQuota:
          type: integer
          nullable: true
        dailySentCount:
          type: integer

    # 审计日志
    AuditLog:
      type: object
      properties:
        id:
          type: string
        accountNo:
          type: string
        employeeName:
          type: string
        loginIp:
          type: string
        userAgent:
          type: string
        module:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        beforeJson:
          type: object
        afterJson:
          type: object
        result:
          type: string
          enum: [SUCCESS, FAIL]
        operatedAt:
          type: string
          format: date-time

    # 附件
    Attachment:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
        fileType:
          type: string
        fileExt:
          type: string
        downloadUrl:
          type: string
        createdAt:
          type: string
          format: date-time