# ── 项目标识 ──────────────────────────────────────────────────
sonar.projectKey=mes-ai-platform
sonar.projectName=芯智云匠 MES AI 平台
sonar.projectVersion=1.1
# SonarQube 服务地址（自托管，端口 9100，避开 MinIO 的 9000）
# SONAR_HOST_URL 和 SONAR_TOKEN 通过 GitHub Secrets 注入

# ── 源码路径 ──────────────────────────────────────────────────
# AI 网关（Python）
sonar.sources=src/ai-gateway/app
sonar.tests=src/ai-gateway/tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=src/ai-gateway/coverage.xml

# Java 后端（Sprint 1 S1-5 完成后解注释）
# sonar.java.source=11
# sonar.java.binaries=src/main/target/classes
# sonar.junit.reportPaths=src/main/target/surefire-reports
# sonar.coverage.jacoco.xmlReportPaths=src/main/target/site/jacoco/jacoco.xml

# ── 排除路径 ──────────────────────────────────────────────────
sonar.exclusions=\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/node_modules/**,\
  **/target/**,\
  **/dist/**,\
  docs/**,\
  scripts/**,\
  assertions/**

sonar.test.exclusions=\
  src/ai-gateway/tests/**

# ── 质量门禁（对应 CLAUDE.md §8.1 要求）──────────────────────
# 在 SonarQube 界面配置 Quality Gate：
#   - Critical Issues = 0       （阻断条件，零容忍）
#   - Coverage >= 70%           （单元测试覆盖率）
#   - Duplications < 3%         （代码重复率）
#   - Maintainability Rating = A（可维护性）

# ── 语言配置 ──────────────────────────────────────────────────
sonar.language=py
sonar.sourceEncoding=UTF-8
