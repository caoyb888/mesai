# ─────────────────────────────────────────────────────────────────────────────
# 开发环境配置（application-dev.yml）
# 激活方式：SPRING_PROFILES_ACTIVE=dev（默认值）
# 说明：本地开发时连接本机服务，数据库连接通过 .env 或 IDE 环境变量注入
# ─────────────────────────────────────────────────────────────────────────────

spring:
  # ── AI 平台主数据源（MySQL 8.x，可读写）──────────────────────────
  datasource:
    # 连接串、用户名、密码通过环境变量注入（见 .env.example）
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool-MesAI-Dev
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── Redis（本地开发实例）──────────────────────────────────────────
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# ── ITSM 测试数据源（演示接口直连，通过环境变量注入，禁止硬编码）──
itsm:
  datasource:
    url: ${ITSM_DB_URL:}
    username: ${ITSM_DB_USERNAME:}
    password: ${ITSM_DB_PASSWORD:}
    # 驱动类：MySQL 用 com.mysql.cj.jdbc.Driver，PostgreSQL 用 org.postgresql.Driver
    driver-class-name: ${ITSM_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      pool-name: HikariPool-ITSM-Demo
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      # 只读连接池，禁止写提交（演示模式下DML使用手动事务+回滚）
      read-only: false

# ── 开发环境：开启 MyBatis SQL 调试日志 ──────────────────────────
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ── 开发环境：关闭 Spring Security（便于接口测试），根据需要开启 ──
# 注意：test/prod 环境必须开启 Security
spring.security.enabled: true

# ── JWT 配置（开发环境使用固定 Secret，禁止在 prod 使用）─────────
security:
  jwt:
    secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS10ZXN0LXNlY3JldC0xMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXo=}
    access-token-expire-seconds: 28800
    refresh-token-expire-seconds: 604800

# ── 日志级别（开发环境 DEBUG，生产禁止）──────────────────────────
logging:
  level:
    com.xingtong.mesai: DEBUG
    org.springframework.web: DEBUG
