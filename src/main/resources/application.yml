# ─────────────────────────────────────────────────────────────────────────────
# 芯智云匠 MES AI 智能体平台 - 应用主配置
# 说明：此文件为基础公共配置，敏感项全部通过环境变量注入（见 CLAUDE.md 4.1节）
# 禁止在本文件中硬编码任何 IP 地址、密码、API Key 或生产环境连接串
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: mesai

  # 默认激活 dev 环境，CI/CD 通过 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ── Jackson 全局配置 ───────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ── MyBatis Plus ───────────────────────────────────────────────
  mybatis-plus:
    # Mapper XML 文件路径
    mapper-locations: classpath*:mapper/**/*.xml
    # 实体类包路径（开启驼峰与下划线自动映射）
    type-aliases-package: com.xingtong.mesai.module.*.entity
    configuration:
      map-underscore-to-camel-case: true
      # 生产环境禁用 DEBUG SQL 日志（开发环境通过 application-dev.yml 开启）
      log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    global-config:
      db-config:
        # 主键策略：自增（与数据库 AUTO_INCREMENT 对应）
        id-type: auto
        # 逻辑删除字段名（Entity 中用 @TableLogic 标注）
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0

# ── 服务端口 ───────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # Tomcat 请求编码
  tomcat:
    uri-encoding: UTF-8
    # 最大请求体大小（文件上传限制 50MB，见 CLAUDE.md 4.3节）
    max-http-form-post-size: 52428800

# ── 文件上传大小限制 ────────────────────────────────────────────────
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB

# ── 日志基础配置（详细格式见 logback-spring.xml）──────────────────
logging:
  config: classpath:logback-spring.xml
  file:
    path: ${LOG_PATH:/var/log/mesai}

# ── AI 网关连接配置（敏感项通过环境变量注入）──────────────────────
ai:
  gateway:
    base-url: ${AI_GATEWAY_URL:http://localhost:8000}
    api-key: ${AI_GATEWAY_API_KEY:}
    timeout-seconds: ${AI_GATEWAY_TIMEOUT:120}
    max-retries: ${AI_GATEWAY_MAX_RETRIES:3}
    # Token 预算配置（见 CLAUDE.md 第十二章）
    token-daily-budget: ${TOKEN_DAILY_BUDGET:3000000}
    token-degrade-threshold: ${TOKEN_DEGRADE_THRESHOLD:2500000}
    # 企业微信告警 Webhook（空则禁用告警）
    wechat-webhook-url: ${WECHAT_WEBHOOK_URL:}
